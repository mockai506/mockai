<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MockAI - AI Interview Coach</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#e8e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh}.app{max-width:430px;margin:0 auto;min-height:100vh}.nav{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e1e2e;position:sticky;top:0;background:#0a0a0fdd;backdrop-filter:blur(12px)}.logo{font-size:20px;font-weight:800}.logo span{color:#7c5cfc}.hero{background:linear-gradient(135deg,#1a0a2e,#0d0d2e);margin:16px;border-radius:20px;padding:24px;text-align:center}.hero h1{font-size:26px;font-weight:800;margin-bottom:8px;letter-spacing:-1px}.hero h1 em{font-style:normal;color:#c084fc}.hero p{color:#7c7c9e;font-size:13px;margin-bottom:20px}.stats{display:flex;gap:10px;justify-content:center}.stat{background:#ffffff10;border-radius:10px;padding:10px 16px;text-align:center}.stat-n{font-size:20px;font-weight:800;color:#c084fc}.stat-l{font-size:10px;color:#7c7c9e}.section{padding:0 16px 16px}.section h2{font-size:15px;font-weight:700;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.card{background:#111120;border:1.5px solid #1e1e2e;border-radius:12px;padding:14px 8px;text-align:center;cursor:pointer;transition:all 0.2s}.card:hover,.card.sel{border-color:#7c5cfc;background:#1a1030}.icon{font-size:22px;margin-bottom:4px}.name{font-size:10px;color:#c8c8e0;font-weight:600;line-height:1.3}.levels{display:flex;gap:8px;margin-bottom:14px}.lvl{flex:1;padding:10px;background:#111120;border:1.5px solid #1e1e2e;border-radius:8px;color:#7c7c9e;font-size:12px;text-align:center;cursor:pointer;transition:all 0.15s}.lvl.sel,.lvl:hover{border-color:#7c5cfc;color:#c084fc;background:#1a1030}.info{background:#111120;border:1px solid #1e1e2e;border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;font-size:13px}.info-v{color:#c084fc;font-weight:700}.btn{width:100%;padding:16px;background:linear-gradient(135deg,#7c5cfc,#9b7cfc);border:none;border-radius:12px;color:white;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:8px}.btn:hover{opacity:0.9}.qa{background:#111120;border:1px solid #1e1e2e;border-radius:14px;padding:20px;margin:16px}.qa-n{font-size:10px;letter-spacing:2px;color:#7c5cfc;text-transform:uppercase;margin-bottom:8px}.qa-q{font-size:16px;font-weight:600;line-height:1.5;margin-bottom:16px}.ta{width:100%;background:#0d0d1a;border:1.5px solid #1e1e2e;border-radius:10px;padding:12px;color:#e8e8f0;font-size:14px;font-family:inherit;resize:none;min-height:100px;margin-bottom:12px}.ta:focus{outline:none;border-color:#7c5cfc}.fb{background:#0d1a0d;border:1px solid #1e4e1e;border-radius:12px;padding:16px;margin-bottom:12px}.fb-t{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.fb-l{font-size:10px;letter-spacing:2px;color:#4ade80;text-transform:uppercase}.fb-s{font-size:13px;font-weight:700;color:#4ade80;background:#0a2a0a;border:1px solid #1e4e1e;padding:3px 10px;border-radius:20px}.fb-txt{font-size:13px;color:#a8d8a8;line-height:1.6}.res{text-align:center;padding:24px 16px}.res h2{font-size:24px;font-weight:800;margin-bottom:4px}.res-s{color:#7c7c9e;font-size:13px;margin-bottom:20px}.ring{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}.ring-in{width:82px;height:82px;background:#0a0a0f;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring-n{font-size:26px;font-weight:800;color:#c084fc}.ring-d{font-size:10px;color:#7c7c9e}.grade{background:#1a1030;border:1px solid #3e2e7e;border-radius:12px;padding:14px;margin-bottom:16px}.grade-e{font-size:24px;margin-bottom:4px}.grade-l{font-size:15px;font-weight:700;color:#c084fc}.qa-res{background:#111120;border:1px solid #1e1e2e;border-radius:12px;padding:14px;margin-bottom:8px;text-align:left}.qa-res-q{font-size:12px;font-weight:600;margin-bottom:3px}.qa-res-a{font-size:11px;color:#7c7c9e;font-style:italic;margin-bottom:4px}.qa-res-s{font-size:11px;color:#7c5cfc}.dot{width:6px;height:6px;background:#7c5cfc;border-radius:50%;display:inline-block;animation:b 1.2s infinite}.dot2{animation-delay:.2s}.dot3{animation-delay:.4s}@keyframes b{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-6px);opacity:1}}</style></head><body><div class="app" id="app"></div><script>const ROLES=[{id:"fe",icon:"💻",name:"Frontend Dev",qs:12},{id:"be",icon:"⚙️",name:"Backend Dev",qs:12},{id:"fs",icon:"🖥️",name:"Full Stack",qs:12},{id:"ml",icon:"🤖",name:"ML Engineer",qs:12},{id:"da",icon:"📊",name:"Data Analyst",qs:12},{id:"ds",icon:"🔬",name:"Data Scientist",qs:12},{id:"do",icon:"🔧",name:"DevOps",qs:12},{id:"cl",icon:"☁️",name:"Cloud Arch",qs:12},{id:"cy",icon:"🔐",name:"Cybersecurity",qs:12},{id:"mo",icon:"📱",name:"Mobile Dev",qs:12},{id:"qa",icon:"🧪",name:"QA Engineer",qs:12},{id:"ui",icon:"🎨",name:"UI/UX",qs:10},{id:"gd",icon:"✏️",name:"Graphic Design",qs:10},{id:"cw",icon:"📝",name:"Content Writer",qs:10},{id:"pm",icon:"📋",name:"Product Mgr",qs:10},{id:"pj",icon:"🗂️",name:"Project Mgr",qs:10},{id:"ba",icon:"📈",name:"Business Analyst",qs:10},{id:"fi",icon:"💰",name:"Finance Analyst",qs:10},{id:"hr",icon:"🤝",name:"HR Manager",qs:10},{id:"sl",icon:"🎯",name:"Sales Executive",qs:10},{id:"mk",icon:"📣",name:"Digital Marketer",qs:10},{id:"sp",icon:"🔍",name:"SEO Specialist",qs:10},{id:"bc",icon:"⛓️",name:"Blockchain",qs:12},{id:"ai",icon:"🧠",name:"AI Scientist",qs:12},{id:"gm",icon:"🎮",name:"Game Dev",qs:12}];let state={page:"home",role:null,level:"Mid-level",questions:[],current:0,answer:"",feedback:null,results:[],total:0,loading:false};function r(){const a=document.getElementById("app");if(!a)return;if(state.page==="home")a.innerHTML=homeHTML();else if(state.page==="interview")a.innerHTML=interviewHTML();else if(state.page==="results")a.innerHTML=resultsHTML();bindEvents()}function homeHTML(){returnMockAIv1.0Crack yourdream interviewAI-powered mock interviews • Real feedback • 25+ roles25+RolesAIFeedback∞Practice⚡ Choose Your RoleROLES.map(r=>`<div class="card state.role state.role.id===r.id?" sel":"" " onclick="selectRole(' r.id ')"><div class="icon"> r.icon </div><div class="name"> r.name </div></div>`).join("") </div>{state.role?<h2>📊 Experience Level</h2><div class="levels"><div class="lvl${state.level==="Fresher"?" sel":""}" onclick="setLevel('Fresher')">Fresher</div><div class="lvl${state.level==="Mid-level"?" sel":""}" onclick="setLevel('Mid-level')">Mid-level</div><div class="lvl${state.level==="Senior"?" sel":""}" onclick="setLevel('Senior')">Senior</div></div><div class="info"><span>${state.role.icon} ${state.role.name} • ${state.level}</span><span class="info-v">${state.role.qs} Qs</span></div><button class="btn" onclick="startInterview()">Start Interview 🚀</button>:""}}function interviewHTML(){if(state.loading&&!state.questions.length)returnMockAIstate.current+1 /{state.questions.length||"?"}Loading...   Generating questions...;if(state.feedback)returnMockAIstate.current+1 /{state.questions.length}Question state.current+1 </div><div class="qa-q">{state.questions[state.current]}AI Feedbackstate.feedback.score /10</div></div><div class="fb-txt">{state.feedback.feedback}state.current+1>=state.questions.length?"See Results 🎉":"Next Question →" </button></div>`;return`<div class="nav"><div class="logo">Mock<span>AI</span></div><div style="font-size:12px;color:#7c7c9e">{state.current+1}/state.questions.length </div></div><div class="qa"><div class="qa-n">Question state.current+1 </div><div class="qa-q">{state.questions[state.current]||"Loading..."}state.answer </textarea><div style="display:flex;gap:8px"><button class="btn" style="flex:1" onclick="submitAns()" state.loading||!state.questions.length?"disabled":"" >Submit ✓</button><button onclick="skipQ()" style="padding:14px 16px;background:#111120;border:1.5px solid #1e1e2e;border-radius:10px;color:#7c7c9e;cursor:pointer">Skip</button></div></div>` function resultsHTML() const avg=state.results.length?Math.round(state.total/state.results.length):0;const g=avg>=9? e:"🏆",l:"Outstanding",c:"#fbbf24" :avg>=7? e:"⭐",l:"Excellent",c:"#10b981" :avg>=5? e:"👍",l:"Good",c:"#06b6d4" : e:"💪",l:"Keep Practicing",c:"#f87171" ;return`<div class="nav"><div class="logo">Mock<span>AI</span></div></div><div class="res"><h2>Interview Done! 🎉</h2><div class="res-s">{state.role.icon} state.role.name • state.level </div><div class="ring" style="background:conic-gradient(#7c5cfc avg*36 deg,#1e1e2e avg*36 deg)"><div class="ring-in"><div class="ring-n">{avg}/ 10g.e </div><div class="grade-l" style="color:{g.c}">g.l </div></div>{state.results.map((res,i)=><div class="qa-res"><div class="qa-res-q">Q${i+1}: ${res.q}</div><div class="qa-res-a">${res.a.length>60?res.a.slice(0,60)+"...":res.a}</div><div class="qa-res-s">Score: ${res.score}/10 • ${res.feedback}</div></div>).join("")}Practice Again 🚀}function bindEvents(){document.querySelectorAll("textarea").forEach(t=>{t.addEventListener("input",function(){state.answer=this.value})})}function selectRole(id){state.role=ROLES.find(r=>r.id===id);r()}function setLevel(l){state.level=l;r()}async function startInterview(){state.loading=true;state.page="interview";state.questions=[];state.current=0;state.results=[];state.total=0;state.answer="";state.feedback=null;r();try{const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,system:"Expert interviewer. Return ONLY JSON array of "+state.role.qs+" question strings. No markdown.",messages:[{role:"user",content:"Generate exactly "+state.role.qs+" "+state.level+" interview questions for "+state.role.name+" role. Mix: 40% technical, 30% behavioral, 20% problem-solving, 10% culture fit."}]})});const d=await res.json();const qs=JSON.parse(d.content.map(b=>b.text||"").join("").replace(/```json|```/g,"").trim());state.questions=qs.slice(0,state.role.qs)}catch(e){state.questions=Array.from({length:state.role.qs},(_,i)=>["Tell me about yourself.","Describe a challenging project.","How do you handle tight deadlines?","What are your key strengths?","Where do you see yourself in 3 years?","How do you stay updated with industry trends?","Describe a time you disagreed with your team.","What is your approach to learning new things?","How do you prioritize tasks under pressure?","Tell me about a failure and what you learned.","How do you handle feedback?","What makes you a good fit for this role?"][i%12])}state.loading=false;r()}async function submitAns(){const ans=document.getElementById("ans")?.value||state.answer;if(!ans.trim())return;state.loading=true;state.answer=ans;r();try{const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:500,system:"Expert interviewer. Return ONLY JSON: {\"score\":<1-10>,\"feedback\":\"<2 sentences>\"}",messages:[{role:"user",content:"Q: \""+state.questions[state.current]+"\"\nA: \""+ans+"\""}]})});const d=await res.json();const fb=JSON.parse(d.content.map(b=>b.text||"").join("").replace(/```json|```/g,"").trim());state.feedback=fb;state.results.push({q:state.questions[state.current],a:ans,score:fb.score,feedback:fb.feedback});state.total+=fb.score}catch(e){state.feedback={score:7,feedback:"Good attempt! Add specific examples to strengthen your answer."};state.results.push({q:state.questions[state.current],a:ans,score:7,feedback:state.feedback.feedback});state.total+=7}state.loading=false;r()}function nextQ(){if(state.current+1>=state.questions.length){state.page="results"}else{state.current++;state.answer="";state.feedback=null}r()}function skipQ(){state.results.push({q:state.questions[state.current],a:"(Skipped)",score:0,feedback:"Skipped."});state.total+=0;if(state.current+1>=state.questions.length){state.page="results"}else{state.current++;state.answer="";state.feedback=null}r()}function restart(){state={page:"home",role:null,level:"Mid-level",questions:[],current:0,answer:"",feedback:null,results:[],total:0,loading:false};r()}r();</script></body></html>
