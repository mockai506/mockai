<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, remove, onDisconnect, push, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyATgC99dP9WE0D9GRSs-XzV5tZCL4G89V4",
    authDomain: "mockai-17c4a.firebaseapp.com",
    databaseURL: "https://mockai-17c4a-default-rtdb.firebaseio.com",
    projectId: "mockai-17c4a",
    storageBucket: "mockai-17c4a.firebasestorage.app",
    messagingSenderId: "195875018386",
    appId: "1:195875018386:web:d9e54444b2a9cebaf9784b",
    measurementId: "G-L0W89SMZ44"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // ── REAL-TIME ONLINE USERS ────────────────────────────────────────
  // Generate unique session ID
  const sessionId = Math.random().toString(36).substr(2,9) + Date.now();
  const userRef = ref(db, `online_users/${sessionId}`);

  // Add user to online list
  set(userRef, { timestamp: Date.now() });

  // Remove when user leaves
  onDisconnect(userRef).remove();

  // Listen to online count in real-time
  const onlineRef = ref(db, 'online_users');
  onValue(onlineRef, (snap) => {
    const count = snap.size || 0;
    const el = document.getElementById('live-counter');
    if(el) el.textContent = `${Math.max(1, count)} ${count === 1 ? 'person' : 'people'} practicing right now 🌍`;
  });

  // Clean old sessions (older than 5 minutes) every minute
  setInterval(async () => {
    const snap = await get(onlineRef);
    if(snap.exists()){
      const now = Date.now();
      snap.forEach(child => {
        if(now - (child.val().timestamp || 0) > 300000){
          remove(ref(db, `online_users/${child.key}`));
        }
      });
    }
  }, 60000);

  // ── REFERRAL SYSTEM ───────────────────────────────────────────────
  // Get or create referral code for this user
  let myReferralCode = localStorage.getItem('mockai_ref_code');
  if(!myReferralCode){
    myReferralCode = 'REF' + Math.random().toString(36).substr(2,6).toUpperCase();
    localStorage.setItem('mockai_ref_code', myReferralCode);
  }

  // Check if user came from a referral link
  const urlParams = new URLSearchParams(window.location.search);
  const refCode = urlParams.get('ref');
  if(refCode && refCode !== myReferralCode && !localStorage.getItem('mockai_ref_used')){
    localStorage.setItem('mockai_ref_used', 'true');
    // Give referrer +100 XP bonus
    const refData = ref(db, `referrals/${refCode}`);
    get(refData).then(snap => {
      if(snap.exists()){
        const data = snap.val();
        set(refData, { ...data, count: (data.count||0) + 1, lastUsed: Date.now() });
      } else {
        set(refData, { count: 1, lastUsed: Date.now() });
      }
    });
    // Give new user welcome bonus
    setTimeout(() => {
      if(window.addXP) window.addXP(50, 'Welcome Bonus (Referral)! 🎁');
    }, 2000);
  }

  // Save referral code data
  set(ref(db, `referrals/${myReferralCode}`), {
    code: myReferralCode,
    created: Date.now()
  });

  // Expose to global scope for use in app
  window.firebaseDB = db;
  window.myReferralCode = myReferralCode;
  window.firebaseRef = ref;
  window.firebaseSet = set;
  window.firebaseGet = get;
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e8e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh}
.app{max-width:430px;margin:0 auto;min-height:100vh}
.nav{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e1e2e;position:sticky;top:0;background:#0a0a0fdd;backdrop-filter:blur(12px);z-index:99}
.logo{font-size:20px;font-weight:800}.logo span{color:#7c5cfc}
.xp-bar-wrap{background:#1e1e2e;border-radius:20px;height:6px;width:80px}
.xp-bar-fill{height:6px;border-radius:20px;background:linear-gradient(90deg,#7c5cfc,#c084fc);transition:width 0.4s}
.xp-info{font-size:10px;color:#7c7c9e;text-align:right}

/* Bottom Nav */
.bnav{display:flex;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#0d0d1a;border-top:1px solid #1e1e2e;z-index:100}
.bnav-btn{flex:1;padding:12px 4px 10px;text-align:center;cursor:pointer;font-size:9px;color:#7c7c9e;transition:all 0.15s}
.bnav-btn.act{color:#c084fc}
.bnav-icon{font-size:20px;display:block;margin-bottom:2px}

.hero{background:linear-gradient(135deg,#1a0a2e,#0d0d2e);margin:16px;border-radius:20px;padding:20px;text-align:center}
.hero h1{font-size:24px;font-weight:800;margin-bottom:6px;letter-spacing:-1px}
.hero h1 em{font-style:normal;color:#c084fc}
.hero p{color:#7c7c9e;font-size:12px;margin-bottom:16px}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.stat{background:#ffffff10;border-radius:10px;padding:8px 12px;text-align:center}
.stat-n{font-size:18px;font-weight:800;color:#c084fc}
.stat-l{font-size:9px;color:#7c7c9e}

/* Daily Challenge Banner */
.dc-banner{margin:0 16px 0;background:linear-gradient(135deg,#1a0a2e,#2a0a1e);border:1px solid #3e1e5e;border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dc-left{flex:1}
.dc-tag{font-size:9px;letter-spacing:2px;color:#c084fc;text-transform:uppercase;margin-bottom:4px}
.dc-title{font-size:13px;font-weight:700;margin-bottom:2px}
.dc-sub{font-size:10px;color:#7c7c9e}
.dc-xp{background:#7c5cfc;color:white;font-size:11px;font-weight:800;padding:6px 12px;border-radius:20px;cursor:pointer;white-space:nowrap}

.section{padding:0 16px 16px}
.section h2{font-size:14px;font-weight:700;margin-bottom:10px}
.lang-tabs{display:flex;gap:6px;margin-bottom:14px}
.lang-tab{flex:1;padding:8px;background:#111120;border:1.5px solid #1e1e2e;border-radius:8px;color:#7c7c9e;font-size:11px;text-align:center;cursor:pointer;transition:all 0.15s}
.lang-tab.sel{border-color:#7c5cfc;color:#c084fc;background:#1a1030}
.cat-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;scrollbar-width:none}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-btn{flex-shrink:0;padding:6px 12px;background:#111120;border:1.5px solid #1e1e2e;border-radius:20px;color:#7c7c9e;font-size:11px;cursor:pointer;white-space:nowrap;transition:all 0.15s}
.cat-btn.sel{border-color:#7c5cfc;color:#c084fc;background:#1a1030}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.card{background:#111120;border:1.5px solid #1e1e2e;border-radius:12px;padding:12px 6px;text-align:center;cursor:pointer;transition:all 0.2s}
.card:hover,.card.sel{border-color:#7c5cfc;background:#1a1030}
.icon{font-size:20px;margin-bottom:3px}
.name{font-size:9px;color:#c8c8e0;font-weight:600;line-height:1.3}
.levels{display:flex;gap:8px;margin-bottom:12px}
.lvl{flex:1;padding:9px;background:#111120;border:1.5px solid #1e1e2e;border-radius:8px;color:#7c7c9e;font-size:11px;text-align:center;cursor:pointer;transition:all 0.15s}
.lvl.sel,.lvl:hover{border-color:#7c5cfc;color:#c084fc;background:#1a1030}
.diff-row{display:flex;gap:8px;margin-bottom:12px}
.diff{flex:1;padding:9px;border-radius:8px;font-size:10px;font-weight:700;text-align:center;cursor:pointer;border:1.5px solid transparent;transition:all 0.15s}
.diff-easy{background:#0d1a0d;border-color:#1e4e1e;color:#4ade80}
.diff-easy.sel{background:#1a3a1a;border-color:#4ade80}
.diff-med{background:#1a1500;border-color:#3a3000;color:#fbbf24}
.diff-med.sel{background:#2a2000;border-color:#fbbf24}
.diff-hard{background:#1a0d0d;border-color:#4e1e1e;color:#f87171}
.diff-hard.sel{background:#2a1010;border-color:#f87171}

/* Company Mode */
.company-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:none}
.company-scroll::-webkit-scrollbar{display:none}
.co-card{flex-shrink:0;background:#111120;border:1.5px solid #1e1e2e;border-radius:12px;padding:10px 14px;text-align:center;cursor:pointer;transition:all 0.2s;min-width:70px}
.co-card.sel{border-color:#7c5cfc;background:#1a1030}
.co-icon{font-size:20px;margin-bottom:3px}
.co-name{font-size:9px;color:#c8c8e0;font-weight:600}

.info{background:#111120;border:1px solid #1e1e2e;border-radius:10px;padding:11px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.info-v{color:#c084fc;font-weight:700}
.btn{width:100%;padding:15px;background:linear-gradient(135deg,#7c5cfc,#9b7cfc);border:none;border-radius:12px;color:white;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:8px}
.btn:hover{opacity:0.9}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-outline{width:100%;padding:12px;background:transparent;border:1.5px solid #7c5cfc;border-radius:12px;color:#c084fc;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px}

/* Timer */
.timer-bar{height:4px;background:#1e1e2e;border-radius:2px;margin-bottom:14px;overflow:hidden}
.timer-fill{height:100%;border-radius:2px;transition:width 1s linear}
.timer-txt{font-size:11px;text-align:right;margin-bottom:6px}
.qa{background:#111120;border:1px solid #1e1e2e;border-radius:14px;padding:18px;margin:16px}
.qa-n{font-size:10px;letter-spacing:2px;color:#7c5cfc;text-transform:uppercase;margin-bottom:6px}
.qa-q{font-size:15px;font-weight:600;line-height:1.5;margin-bottom:14px}
.ta{width:100%;background:#0d0d1a;border:1.5px solid #1e1e2e;border-radius:10px;padding:12px;color:#e8e8f0;font-size:14px;font-family:inherit;resize:none;min-height:90px;margin-bottom:10px}
.ta:focus{outline:none;border-color:#7c5cfc}

/* Voice btn */
.voice-btn{padding:14px 16px;background:#111120;border:1.5px solid #1e1e2e;border-radius:10px;color:#7c7c9e;cursor:pointer;font-size:18px;transition:all 0.2s}
.voice-btn.listening{border-color:#f87171;color:#f87171;background:#1a0d0d;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}

.fb{background:#0d1a0d;border:1px solid #1e4e1e;border-radius:12px;padding:14px;margin-bottom:10px}
.fb-t{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.fb-l{font-size:10px;letter-spacing:2px;color:#4ade80;text-transform:uppercase}
.fb-s{font-size:13px;font-weight:700;color:#4ade80;background:#0a2a0a;border:1px solid #1e4e1e;padding:3px 10px;border-radius:20px}
.fb-txt{font-size:13px;color:#a8d8a8;line-height:1.6}
.res{text-align:center;padding:20px 16px 80px}
.res h2{font-size:22px;font-weight:800;margin-bottom:4px}
.res-s{color:#7c7c9e;font-size:12px;margin-bottom:16px}
.ring{width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.ring-in{width:74px;height:74px;background:#0a0a0f;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-n{font-size:24px;font-weight:800;color:#c084fc}
.ring-d{font-size:10px;color:#7c7c9e}

@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

.qa-res{background:#111120;border:1px solid #1e1e2e;border-radius:12px;padding:12px;margin-bottom:8px;text-align:left}

.qa-res-a{font-size:10px;color:#7c7c9e;font-style:italic;margin-bottom:3px}
.qa-res-s{font-size:10px;color:#7c5cfc}
.dot{width:6px;height:6px;background:#7c5cfc;border-radius:50%;display:inline-block;animation:b 1.2s infinite}
.dot2{animation-delay:.2s}.dot3{animation-delay:.4s}
@keyframes b{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-6px);opacity:1}}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:9px;font-weight:700;margin-left:4px}
.badge-easy{background:#0d1a0d;color:#4ade80;border:1px solid #1e4e1e}
.badge-med{background:#1a1500;color:#fbbf24;border:1px solid #3a3000}
.badge-hard{background:#1a0d0d;color:#f87171;border:1px solid #4e1e1e}

/* History Page */
.hist-card{background:#111120;border:1px solid #1e1e2e;border-radius:12px;padding:14px;margin-bottom:10px}
.hist-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hist-role{font-size:13px;font-weight:700}
.hist-score{font-size:13px;font-weight:800;color:#c084fc}
.hist-meta{font-size:10px;color:#7c7c9e}
.hist-bar{height:3px;background:#1e1e2e;border-radius:2px;margin-top:8px}
.hist-bar-fill{height:3px;border-radius:2px;background:linear-gradient(90deg,#7c5cfc,#c084fc)}
.empty-state{text-align:center;padding:40px 20px;color:#7c7c9e}
.empty-icon{font-size:40px;margin-bottom:12px}

/* XP Profile */
.xp-card{background:linear-gradient(135deg,#1a0a2e,#0d0d2e);border:1px solid #3e2e7e;border-radius:16px;padding:20px;margin-bottom:14px;text-align:center}
.xp-level-badge{display:inline-block;background:#7c5cfc;color:white;font-size:11px;font-weight:800;padding:4px 14px;border-radius:20px;margin-bottom:10px}
.xp-total{font-size:32px;font-weight:800;color:#c084fc}
.xp-label{font-size:11px;color:#7c7c9e;margin-bottom:10px}
.xp-progress{background:#1e1e2e;border-radius:10px;height:8px;margin-bottom:6px}
.xp-progress-fill{height:8px;border-radius:10px;background:linear-gradient(90deg,#7c5cfc,#c084fc)}
.xp-next{font-size:10px;color:#7c7c9e}
.streak-card{background:#111120;border:1px solid #1e1e2e;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:14px}
.streak-icon{font-size:28px}
.streak-n{font-size:22px;font-weight:800;color:#fbbf24}
.streak-l{font-size:11px;color:#7c7c9e}
.achieve-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.achieve{background:#111120;border:1px solid #1e1e2e;border-radius:10px;padding:12px 6px;text-align:center}
.achieve.unlocked{border-color:#7c5cfc;background:#1a1030}
.achieve-icon{font-size:22px;margin-bottom:4px}
.achieve-name{font-size:9px;color:#7c7c9e;font-weight:600}
.achieve.unlocked .achieve-name{color:#c084fc}

/* Tips Page */
.tip-card{background:#111120;border:1px solid #1e1e2e;border-radius:12px;padding:14px;margin-bottom:10px}
.tip-tag{font-size:9px;letter-spacing:2px;color:#7c5cfc;text-transform:uppercase;margin-bottom:6px}
.tip-title{font-size:13px;font-weight:700;margin-bottom:6px}
.tip-body{font-size:12px;color:#a8a8c0;line-height:1.6}

/* Video Recording */
.video-wrap{position:relative;width:100%;border-radius:14px;overflow:hidden;background:#000;margin-bottom:12px;aspect-ratio:4/3}
.video-wrap video{width:100%;height:100%;object-fit:cover;display:block}
.video-overlay{position:absolute;top:10px;right:10px;display:flex;gap:6px;align-items:center}
.rec-dot{width:10px;height:10px;background:#f87171;border-radius:50%;animation:pulse 1s infinite}
.rec-label{font-size:10px;color:#f87171;font-weight:700;background:#0008;padding:3px 8px;border-radius:10px}
.video-controls{display:flex;gap:8px;margin-bottom:12px}
.vid-btn{flex:1;padding:11px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid;transition:all 0.2s;text-align:center}
.vid-btn-start{background:#0d1a0d;border-color:#4ade80;color:#4ade80}
.vid-btn-stop{background:#1a0d0d;border-color:#f87171;color:#f87171}
.vid-btn-play{background:#111120;border-color:#7c5cfc;color:#c084fc}
.vid-btn-dis{opacity:0.4;cursor:not-allowed}
.vid-timer{text-align:center;font-size:13px;font-weight:700;color:#f87171;margin-bottom:8px}

.resume-drop{border:2px dashed #3e2e7e;border-radius:14px;padding:30px 20px;text-align:center;cursor:pointer;transition:all 0.2s;margin-bottom:14px;background:#0d0d1a}

.resume-drop-icon{font-size:36px;margin-bottom:10px}

.skill-chip.match{background:#0d1a0d;border-color:#1e4e1e;color:#4ade80}
.skill-chip.miss{background:#1a0d0d;border-color:#4e1e1e;color:#f87171}

function loadStorage(){
  try{
    return {
      history: JSON.parse(localStorage.getItem('mockai_history')||'[]'),
      xp: parseInt(localStorage.getItem('mockai_xp')||'0'),
      streak: parseInt(localStorage.getItem('mockai_streak')||'0'),
      lastDate: localStorage.getItem('mockai_lastdate')||'',
      achievements: JSON.parse(localStorage.getItem('mockai_achieve')||'[]'),
      dailyDone: localStorage.getItem('mockai_daily')===new Date().toDateString()
    };
  }catch(e){ return {history:[],xp:0,streak:0,lastDate:'',achievements:[],dailyDone:false}; }
}
function saveStorage(){
  try{
    localStorage.setItem('mockai_history',JSON.stringify(stored.history));

    localStorage.setItem('mockai_lastdate',stored.lastDate);
    localStorage.setItem('mockai_achieve',JSON.stringify(stored.achievements));
  }catch(e){}
}

// ── XP HELPERS ────────────────────────────────────────────────────
function getLevel(xp){
  let lvl=XP_LEVELS[0];
  for(const l of XP_LEVELS){ if(xp>=l.xpNeeded) lvl=l; }
  return lvl;
}
function getNextLevel(xp){
  for(const l of XP_LEVELS){ if(xp<l.xpNeeded) return l; }
  return null;
}
function addXP(amount,reason){
  stored.xp+=amount;
  saveStorage();
  showXPToast(`+${amount} XP — ${reason}`);
}
function showXPToast(msg){
  const el=document.getElementById('xp-toast-el');
  if(!el) return;
  el.textContent=msg; el.style.display='block';
  setTimeout(()=>{ el.style.display='none'; },2000);
}
function updateStreak(){
  const today=new Date().toDateString();
  const yesterday=new Date(Date.now()-86400000).toDateString();
  if(stored.lastDate===yesterday){ stored.streak++; }
  else if(stored.lastDate!==today){ stored.streak=1; }
  stored.lastDate=today;
  saveStorage();
}
function unlockAchievement(id){
  if(!stored.achievements.includes(id)){
    stored.achievements.push(id);
    saveStorage();
    const a=ACHIEVEMENTS.find(x=>x.id===id);
    if(a) showXPToast(`🏅 Achievement: ${a.name}`);
  }
}

let searchTimeout = null;
function handleSearch(val){
  state.search = val;
  const grid = document.getElementById('roles-grid');
  const catGrid = document.getElementById('cat-grid');
  const backBtn = document.getElementById('back-btn');
  const searchWrap = document.getElementById('search-clear');

  if(searchWrap) searchWrap.style.display = val ? 'block' : 'none';
  if(catGrid) catGrid.style.display = val ? 'none' : 'grid';
  if(backBtn) backBtn.style.display = val ? 'none' : 'flex';

  if(!grid) return;

  if(!val){
    grid.style.display = state.cat==='all' ? 'none' : 'grid';
    if(state.cat!=='all'){
      grid.innerHTML = ROLES.filter(x=>x.cat===state.cat).map(role=>`
        <div class="card" onclick="selectRole('${role.id}')">
          <div class="icon">${role.icon}</div>
          <div class="name">${role.name}</div>
        </div>`).join('');
    }
    return;
  }

  // Smart search — match from START of any word in role name
  const q = val.toLowerCase();
  const results = ROLES.filter(x => {
    const words = x.name.toLowerCase().split(/[\s\/]+/);
    const catName = (CATEGORIES.find(c=>c.id===x.cat)?.name||'').toLowerCase();
    return words.some(w => w.startsWith(q)) ||
           x.name.toLowerCase().startsWith(q) ||
           catName.includes(q);
  });

  grid.style.display = 'grid';
  grid.innerHTML = results.length
    ? results.map(role=>`
        <div class="card" onclick="selectRole('${role.id}')">
          <div class="icon">${role.icon}</div>
          <div class="name">${role.name}</div>
        </div>`).join('')
    : `<div style="grid-column:span 3;text-align:center;color:#7c7c9e;padding:20px;font-size:13px">
        No results for "<b style="color:#c084fc">${val}</b>"<br>
        <span style="font-size:11px">Try: D → Data, Fe → Frontend, ML → ML Engineer</span>
       </div>`;
}

  });
}
function setTab(t){ state.tab=t; r(); }
function setLang(l){ state.lang=l; r(); }
function setCat(c){ state.cat=c; r(); }
function selectRole(id){ state.role=ROLES.find(x=>x.id===id); r(); }
function setLevel(l){ state.level=l; r(); }
function setDiff(d){ state.difficulty=d; r(); }

function timerColor(p){ return p>0.5?'#4ade80':p>0.25?'#fbbf24':'#f87171'; }

// Voice Input
function toggleVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ alert('Voice input not supported in this browser. Try Chrome!'); return; }
  if(state.listening){
    if(state.recognition) state.recognition.stop();
    state.listening=false; r(); return;
  }
  const rec=new SR();
  rec.lang=state.lang==='hi'?'hi-IN':'en-IN';
  rec.continuous=true; rec.interimResults=true;
  rec.onresult=e=>{
    let txt='';
    for(let i=0;i<e.results.length;i++) txt+=e.results[i][0].transcript;
    state.answer=txt;
    const ta=document.getElementById('ans');
    if(ta) ta.value=txt;
  };
  rec.onerror=()=>{ state.listening=false; r(); };
  rec.onend=()=>{ state.listening=false; r(); };
  rec.start();
  state.recognition=rec; state.listening=true; r();
}

// Timer
function startTimer(){
  if(state.timerInterval) clearInterval(state.timerInterval);
  state.timerMax=TIMER_SECS[state.difficulty];
  state.timerSec=state.timerMax;
  state.timerInterval=setInterval(()=>{
    state.timerSec--;
    if(state.timerSec<=0){ clearInterval(state.timerInterval); autoSubmit(); }
    else{
      const fill=document.querySelector('.timer-fill');
      const txt=document.querySelector('.timer-txt');
      if(fill){
        const pct=state.timerSec/state.timerMax;
        fill.style.width=(pct*100)+'%';
        fill.style.background=timerColor(pct);
        if(txt){
          const m=Math.floor(state.timerSec/60),s=state.timerSec%60;
          txt.textContent=`${L('timeLeft')}: ${m}:${s.toString().padStart(2,'0')}`;
          txt.style.color=timerColor(pct);
        }
      }
    }
  },1000);
}
async function autoSubmit(){
  const ans=document.getElementById('ans')?.value||state.answer||'(No answer — time up)';
  state.answer=ans; await doSubmit(ans);
}

// Daily Challenge
function startDaily(){
  const ch=todayChallenge;
  if(ch.role){
    state.role=ROLES.find(x=>x.id===ch.role)||ROLES[0];
  } else {
    state.role=ROLES[Math.floor(Math.random()*ROLES.length)];
  }
  state.difficulty=ch.diff;
  state.level='Mid-level';
  state.company='none';
  state.isDaily=true;
  startInterview();
}

// Start Interview
async function startInterview(){
  state.loading=true; state.page='interview';
  state.questions=[]; state.current=0;
  state.results=[]; state.total=0;
  state.answer=''; state.feedback=null;
  r();
  const langInstr=state.lang==='hi'?'Generate questions in Hindi.':state.lang==='hing'?'Generate questions in Hinglish (Hindi+English mix).':'Generate questions in English.';
  const co=COMPANIES.find(x=>x.id===state.company);
  const coCtx=co&&co.id!=='none'?` specifically for a ${co.name} style interview (focus on their culture, values, and typical question style)`:'';
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',max_tokens:1000,
        system:`Expert interviewer. Return ONLY a JSON array of ${state.role.qs} question strings. No markdown. ${langInstr}`,
        messages:[{role:'user',content:`Generate exactly ${state.role.qs} ${state.difficulty} level ${state.level} interview questions for ${state.role.name} role${coCtx}. Mix: 40% technical, 30% behavioral, 20% problem-solving, 10% culture fit.`}]
      })
    });
    const d=await res.json();
    const qs=JSON.parse(d.content.map(b=>b.text||'').join('').replace(/```json|```/g,'').trim());
    state.questions=qs.slice(0,state.role.qs);
  }catch(e){
    state.questions=Array.from({length:state.role.qs},(_,i)=>['Tell me about yourself.','Describe a challenging project.','How do you handle tight deadlines?','What are your key strengths?','Where do you see yourself in 3 years?','How do you stay updated with industry trends?','Describe a time you disagreed with your team.','What is your approach to learning new things?','How do you prioritize tasks under pressure?','Tell me about a failure and what you learned.','How do you handle feedback?','What makes you a good fit for this role?'][i%12]);
  }
  state.loading=false; r(); startTimer();
}

async function submitAns(){
  const ans=document.getElementById('ans')?.value||state.answer;
  if(!ans.trim()) return;
  await doSubmit(ans);
}

async function doSubmit(ans){
  if(state.timerInterval) clearInterval(state.timerInterval);
  if(state.recognition){ state.recognition.stop(); state.listening=false; }
  state.loading=true; state.answer=ans; r();
  const langInstr=state.lang==='hi'?'Respond in Hindi.':state.lang==='hing'?'Respond in Hinglish.':'Respond in English.';
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',max_tokens:800,
        system:`You are an expert interview coach. Evaluate the candidate's answer strictly and honestly. Return ONLY a JSON object in this exact format (no markdown, no extra text):
{"score":<number 1-10>,"what_good":"<1-2 sentences on what was good, or 'Nothing specific' if answer was blank/very poor>","what_missing":"<1-2 sentences on key points missing or improvements needed>","better_answer":"<1-2 sentence example of a stronger answer>"}

Scoring rules (be strict and honest):
- 1-2: Blank, irrelevant, or single word answer
- 3-4: Very weak, missing most key points, no structure
- 5-6: Average, some relevant points but lacks depth or examples
- 7-8: Good, covers key points with some structure
- 9-10: Excellent, specific examples, strong structure, complete answer

${langInstr}`,
        messages:[{role:'user',content:`Interview Question: "${state.questions[state.current]}"\nCandidate's Answer: "${ans||'(No answer provided)'}"\nRole: ${state.role.name}\nDifficulty: ${state.difficulty}\nLevel: ${state.level}`}]
      })
    });
    const d=await res.json();
    const raw=d.content.map(b=>b.text||'').join('').replace(/```json|```/g,'').trim();
    const fb=JSON.parse(raw);
    // Build combined feedback string for results
    const combinedFeedback=`✅ What was good: ${fb.what_good||'N/A'}\n❌ What was missing: ${fb.what_missing||'N/A'}\n💡 Better answer: ${fb.better_answer||'N/A'}`;
    state.feedback={score:fb.score,feedback:combinedFeedback,what_good:fb.what_good,what_missing:fb.what_missing,better_answer:fb.better_answer};
    state.results.push({q:state.questions[state.current],a:ans,score:fb.score,feedback:combinedFeedback});
    state.total+=fb.score;
  }catch(e){
    // Fallback based on answer length
    const ansLen=(ans||'').trim().length;
    const fallbackScore=ansLen===0?1:ansLen<20?3:ansLen<50?5:6;
    const fallbackFeedback=ansLen===0
      ?'✅ What was good: Nothing — no answer provided.\n❌ What was missing: A complete answer.\n💡 Better answer: Always attempt to answer, even partially.'
      :'✅ What was good: You attempted the question.\n❌ What was missing: More specific details and real examples from your experience.\n💡 Better answer: Use the STAR method — Situation, Task, Action, Result.';
    state.feedback={score:fallbackScore,feedback:fallbackFeedback};
    state.results.push({q:state.questions[state.current],a:ans,score:fallbackScore,feedback:fallbackFeedback});
    state.total+=fallbackScore;
  }
  state.loading=false; r();
}

function nextQ(){
  if(state.current+1>=state.questions.length){
    finishInterview();
  } else {
    state.current++; state.answer=''; state.feedback=null; r(); startTimer();
  }
}

function skipQ(){
  if(state.timerInterval) clearInterval(state.timerInterval);
  state.results.push({q:state.questions[state.current],a:'(Skipped)',score:0,feedback:'Skipped.'});
  if(state.current+1>=state.questions.length){
    finishInterview();
  } else {
    state.current++; state.answer=''; state.feedback=null; r(); startTimer();
  }
}

function finishInterview(){
  if(state.timerInterval) clearInterval(state.timerInterval);
  const avg=state.results.length?Math.round(state.total/state.results.length):0;
  const answered=state.results.filter(x=>x.a!=='(Skipped)').length;
  const xpEarned=Math.round(avg*10+(state.difficulty==='Hard'?30:state.difficulty==='Medium'?15:0));

  // Save history
  const co=COMPANIES.find(x=>x.id===state.company);
  stored.history.push({
    roleIcon:state.role.icon, roleName:state.role.name,
    level:state.level, difficulty:state.difficulty,
    company:co&&co.id!=='none'?co.name:'none',
    avg, answered, total:state.results.length,
    date:new Date().toLocaleDateString()
  });

  // Add XP
  addXP(xpEarned, state.difficulty+' Interview');
  updateStreak();

  // Achievements
  if(stored.history.length===1) unlockAchievement('first');
  if(stored.history.length>=10) unlockAchievement('ten');
  if(avg===10) unlockAchievement('perfect');
  if(state.difficulty==='Hard') unlockAchievement('hard');
  if(stored.streak>=3) unlockAchievement('streak3');
  const cats=new Set(stored.history.map(h=>ROLES.find(r=>r.name===h.roleName)?.cat).filter(Boolean));
  if(cats.size>=10) unlockAchievement('allcat');

  // Daily challenge
  if(state.isDaily){
    stored.dailyDone=true;
    localStorage.setItem('mockai_daily',new Date().toDateString());
    addXP(todayChallenge.xp,'Daily Challenge!');
    state.isDaily=false;
  }

  saveStorage();
  state.page='results'; r();
}

// ── VIDEO FUNCTIONS ───────────────────────────────────────────────
async function startCamera(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
    state.videoStream=stream;
    state.recordedBlob=null;
    r();
    setTimeout(()=>{
      const v=document.getElementById('live-video');
      if(v){ v.srcObject=stream; v.play(); }
    },100);
  }catch(e){
    alert('Camera permission denied! Please allow camera access in your browser settings.');
  }
}

function stopCamera(){
  if(state.videoStream){ state.videoStream.getTracks().forEach(t=>t.stop()); state.videoStream=null; }
  if(state.mediaRecorder&&state.isRecording){ state.mediaRecorder.stop(); }
  if(state.videoInterval){ clearInterval(state.videoInterval); }
  state.isRecording=false; state.videoChunks=[]; state.videoSeconds=0;
  r();
}

function startRecording(){
  if(!state.videoStream) return;
  state.videoChunks=[];
  state.videoSeconds=0;
  const mr=new MediaRecorder(state.videoStream);
  mr.ondataavailable=e=>{ if(e.data.size>0) state.videoChunks.push(e.data); };
  mr.onstop=()=>{
    state.recordedBlob=new Blob(state.videoChunks,{type:'video/webm'});
    state.isRecording=false;
    if(state.videoInterval){ clearInterval(state.videoInterval); state.videoInterval=null; }
    r();
    setTimeout(()=>{
      const v=document.getElementById('live-video');
      if(v){ v.srcObject=state.videoStream; v.play(); }
    },100);
  };
  mr.start();
  state.mediaRecorder=mr;
  state.isRecording=true;
  state.videoInterval=setInterval(()=>{ state.videoSeconds++; 
    const lbl=document.querySelector('.rec-label');
    if(lbl) lbl.textContent=`REC ${Math.floor(state.videoSeconds/60)}:${(state.videoSeconds%60).toString().padStart(2,'0')}`;
  },1000);
  r();
  setTimeout(()=>{
    const v=document.getElementById('live-video');
    if(v){ v.srcObject=state.videoStream; v.play(); }
  },100);
}

function stopRecording(){
  if(state.mediaRecorder&&state.isRecording){ state.mediaRecorder.stop(); }
}

function playRecording(){
  if(!state.recordedBlob) return;
  const url=URL.createObjectURL(state.recordedBlob);
  const v=document.getElementById('live-video');
  if(v){ v.srcObject=null; v.src=url; v.play(); }
}

// ── RESUME FUNCTIONS ──────────────────────────────────────────────
function handleResumeFile(input){
  const file = input.files[0];
  if(!file) return;
  if(file.type === 'text/plain'){
    const reader = new FileReader();
    reader.onload = e => { state.resumeText = e.target.result; r(); };
    reader.readAsText(file);
  } else {
    // For PDF/image/doc - just use filename and prompt user
    state.resumeText = `[File uploaded: ${file.name}]\n\nPlease also paste your resume text below for better analysis.`;
    r();
    setTimeout(()=>{
      const ta = document.getElementById('resume-ta');
      if(ta) ta.value = state.resumeText;
    },100);
  }
}

async function analyzeResume(){
  const ta=document.getElementById('resume-ta');
  const text=ta?ta.value:state.resumeText;
  if(!text.trim()){ alert('Please paste your resume text first!'); return; }
  state.resumeText=text;
  state.resumeLoading=true; r();
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',max_tokens:1000,
        system:'You are an expert HR consultant and resume analyzer. Return ONLY valid JSON, no markdown.',
        messages:[{role:'user',content:`Analyze this resume and return JSON with these exact keys:
{
  "score": <number 1-10>,
  "title": "<one line like 'Strong Frontend Developer Resume'>",
  "skills": ["skill1","skill2",...up to 10],
  "roles": ["Best Role Match 1","Best Role Match 2","Best Role Match 3"],
  "missing": ["missing skill 1","missing skill 2",...up to 6],
  "suggestions": "<2-3 sentences of improvement advice>",
  "summary": "<2 sentences about the candidate's profile>"
}

Resume:
${text.slice(0,3000)}`}]
      })
    });
    const d=await res.json();
    const raw=d.content.map(b=>b.text||'').join('').replace(/```json|```/g,'').trim();
    state.resumeAnalysis=JSON.parse(raw);
    addXP(20,'Resume Analyzed');
  }catch(e){
    state.resumeAnalysis={
      score:7,title:'Good Resume — Needs Polish',
      skills:['Communication','Problem Solving','Teamwork'],
      roles:['Frontend Dev','Full Stack','Product Manager'],
      missing:['Specific metrics','GitHub link','LinkedIn URL'],
      suggestions:'Add quantified achievements (e.g. "increased sales by 30%"). Include a strong summary at the top. Tailor keywords to the job description.',
      summary:'The candidate shows solid foundational skills. With better formatting and measurable results, this resume will stand out.'
    };
  }
  state.resumeLoading=false; r();
}

function autoSelectRole(roleName){
  const match=ROLES.find(r=>r.name.toLowerCase().includes(roleName.toLowerCase().split(' ')[0]));
  if(match){ state.role=match; state.tab='home'; r(); }
  else{ state.tab='home'; r(); }
}

function restart(){
  if(state.timerInterval) clearInterval(state.timerInterval);
  if(state.videoStream) state.videoStream.getTracks().forEach(t=>t.stop());
  if(state.videoInterval) clearInterval(state.videoInterval);
  state={page:'home',tab:'home',role:null,level:'Mid-level',
    difficulty:'Medium',lang:state.lang,cat:'all',company:'none',
    questions:[],current:0,answer:'',feedback:null,results:[],total:0,
    loading:false,timerSec:0,timerMax:0,timerInterval:null,
    recognition:null,listening:false,isDaily:false,
    videoStream:null,mediaRecorder:null,videoChunks:[],
    isRecording:false,recordedBlob:null,videoSeconds:0,videoInterval:null,
    resumeText:'',resumeAnalysis:null,resumeLoading:false};
  r();
}

function generateCertificate(){
  const avg=state.results.length?Math.round(state.total/state.results.length):0;
  const g=GRADES.find(x=>avg>=x.min)||GRADES[GRADES.length-1];
  const canvas=document.createElement('canvas');
  canvas.width=900; canvas.height=640;
  const ctx=canvas.getContext('2d');

  // Background gradient
  const bg=ctx.createLinearGradient(0,0,900,640);
  bg.addColorStop(0,'#0a0a1f'); bg.addColorStop(1,'#1a0a2e');
  ctx.fillStyle=bg; ctx.fillRect(0,0,900,640);

  // Border
  ctx.strokeStyle='#7c5cfc'; ctx.lineWidth=4;
  ctx.strokeRect(20,20,860,600);
  ctx.strokeStyle='#c084fc'; ctx.lineWidth=1;
  ctx.strokeRect(30,30,840,580);

  // Stars decoration
  ['#7c5cfc','#c084fc','#fbbf24'].forEach((col,i)=>{
    ctx.fillStyle=col; ctx.font='20px serif';
    ctx.fillText('★',80+i*20,80); ctx.fillText('★',800-i*20,80);
  });

  // Title
  ctx.fillStyle='#c084fc'; ctx.font='bold 18px Arial'; ctx.textAlign='center';
  ctx.fillText('CERTIFICATE OF ACHIEVEMENT',450,120);

  // MockAI Logo text
  ctx.font='bold 42px Arial Black';
  ctx.fillStyle='white'; ctx.fillText('Mock',400,200);
  ctx.fillStyle='#fbbf24'; ctx.fillText('AI',510,200);

  // Main text
  ctx.fillStyle='#e8e8f0'; ctx.font='16px Arial'; ctx.textAlign='center';
  ctx.fillText('This certifies that the holder has successfully completed',450,250);

  // Role
  ctx.font='bold 28px Arial'; ctx.fillStyle='#c084fc';
  ctx.fillText(`${state.role.icon} ${state.role.name} Interview Practice`,450,295);

  // Score
  ctx.font='18px Arial'; ctx.fillStyle='#e8e8f0';
  ctx.fillText(`with an average score of`,450,340);
  ctx.font='bold 52px Arial Black';
  const scoreColor=avg>=8?'#4ade80':avg>=5?'#fbbf24':'#f87171';
  ctx.fillStyle=scoreColor; ctx.fillText(`${avg}/10`,450,400);
  ctx.font='18px Arial'; ctx.fillStyle='#a8a8c0';
  ctx.fillText(`${g.e} ${g.l} — ${state.difficulty} Mode`,450,435);

  // Date
  ctx.font='13px Arial'; ctx.fillStyle='#7c7c9e';
  ctx.fillText(`Date: ${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}`,450,490);

  // Bottom
  ctx.font='bold 13px Arial'; ctx.fillStyle='#7c5cfc';
  ctx.fillText('mockai-vert.vercel.app • Free AI Interview Coach',450,540);
  ctx.font='12px Arial'; ctx.fillStyle='#7c7c9e';
  ctx.fillText('No Login Required • 150+ Roles • Real AI Feedback',450,565);

  // Download
  const link=document.createElement('a');
  link.download=`MockAI_Certificate_${state.role.name.replace(/\s/g,'_')}.png`;
  link.href=canvas.toDataURL('image/png');
  link.click();
  showXPToast('📜 Certificate downloaded!');
  addXP(10,'Certificate Generated');
}
